<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1222" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />
  
  <!-- Outer Glow Hexagon / Frame -->
  <polygon points="100,20 170,58 170,142 100,180 30,142 30,58" fill="none" stroke="url(#neonBlue)" stroke-width="2.5" opacity="0.6" filter="url(#glow)" />
  <polygon points="100,28 162,62 162,138 100,172 38,138 38,62" fill="none" stroke="url(#neonPink)" stroke-width="1.5" opacity="0.4" />

  <!-- Central "7JN" Monogram -->
  <g filter="url(#glow)">
    <!-- Digit 7 -->
    <path d="M 52,68 L 92,68 L 74,124 L 62,124 L 78,80 L 52,80 Z" fill="url(#neonBlue)" />
    <!-- Letter J -->
    <path d="M 106,68 L 118,68 L 118,112 C 118,126 108,132 94,132 C 86,132 80,128 78,124 L 86,116 C 88,118 90,120 94,120 C 100,120 106,118 106,110 Z" fill="url(#neonPink)" />
    <!-- Letter N -->
    <path d="M 124,68 L 136,68 L 152,112 L 152,68 L 164,68 L 164,130 L 152,130 L 136,86 L 136,130 L 124,130 Z" fill="#ffffff" />
  </g>

  <!-- Subtitle Wordmark "TECH" -->
  <text x="100" y="156" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" letter-spacing="4" fill="#fbcfe8">TECH</text>
  
  <!-- Accent Dots -->
  <circle cx="48" cy="153" r="2.5" fill="#f472b6" />
  <circle cx="152" cy="153" r="2.5" fill="#38bdf8" />
</svg>
