<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="pBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1222" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8c8a2" />
      <stop offset="100%" stop-color="#d49b73" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="40" fill="url(#pBgGrad)" />

  <!-- Holographic Outer Ring -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="url(#pAura)" stroke-width="3" opacity="0.8" filter="url(#pGlow)" />
  <circle cx="150" cy="150" r="124" fill="#070d18" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Pulse -->
  <circle cx="150" cy="115" r="75" fill="#3b82f6" opacity="0.12" filter="url(#pGlow)" />

  <!-- Stylized Executive Portrait Silhouette -->
  <!-- Shoulders / Suit -->
  <path d="M 68,260 C 72,212 110,188 150,188 C 190,188 228,212 232,260 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- Suit Collar / Lapels -->
  <polygon points="150,225 125,188 140,188 150,205 160,188 175,188" fill="#1e293b" />
  <polygon points="150,235 142,205 150,195 158,205" fill="url(#pAura)" />

  <!-- Neck -->
  <rect x="138" y="152" width="24" height="34" rx="4" fill="url(#skinTone)" />

  <!-- Head -->
  <ellipse cx="150" cy="120" rx="36" ry="46" fill="url(#skinTone)" />

  <!-- Modern Hairline -->
  <path d="M 112,110 C 112,78 132,68 150,68 C 168,68 188,78 188,110 C 182,90 168,82 150,82 C 132,82 118,90 112,110 Z" fill="#1e293b" />

  <!-- Holographic Monogram Badge -->
  <g transform="translate(150, 240)" filter="url(#pGlow)">
    <rect x="-48" y="-12" width="96" height="24" rx="12" fill="#0b1222" stroke="url(#pAura)" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fbcfe8">JEDDAH S.P.</text>
  </g>
</svg>
